name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "ci/**"

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Lint workflows
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

      - name: Whitespace
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --check "$BASE_SHA...HEAD"

      - name: Shell syntax
        run: |
          set -euo pipefail
          git ls-files -z '*.sh' | xargs -0 -n1 bash -n

      - name: Demo lifecycle tests
        run: python3 -B scripts/test-demo-lifecycle.py

      - name: Deploy script tests
        run: |
          set -euo pipefail
          # The test that each EVM send is on disk before it goes out
          # traces the script's syscalls.
          if ! command -v strace >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y strace
          fi
          python3 -B scripts/test-deploy-scripts.py

      - name: Secret hygiene
        run: |
          set -euo pipefail
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ripgrep
          fi
          bash scripts/secret-hygiene-check.sh
