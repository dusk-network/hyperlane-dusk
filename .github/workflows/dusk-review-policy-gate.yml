name: Dusk Review Policy Gate

on:
  # Run the trusted default-branch workflow while examining the proposed
  # tree. A PR must never be able to certify its own replacement guard.
  pull_request_target:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-policy-gate:
    name: Dusk review policy gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12

      - name: Check worktree and diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$(git ls-files --others --exclude-standard)" ]; then
            git ls-files --others --exclude-standard
            echo "::error::untracked source paths found"
            exit 1
          fi

          base_ref="${GITHUB_BASE_REF:-main}"
          if git rev-parse --verify "origin/$base_ref" >/dev/null 2>&1; then
            git diff --check "origin/$base_ref"...HEAD
          else
            git diff --check HEAD~1..HEAD
          fi

      - name: Check review guard scripts
        shell: bash
        run: |
          set -euo pipefail
          for script in scripts/github-review-hygiene.sh scripts/fail-closed-self-test.sh; do
            if [ ! -f "$script" ]; then
              echo "::error::$script is missing from the proposed tree"
              exit 1
            fi
          done

          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ripgrep
          fi

          for script in scripts/github-review-hygiene.sh scripts/fail-closed-self-test.sh; do
            bash -n "$script"
          done

      - name: Checkout trusted policy harness
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted-policy
          fetch-depth: 1
          persist-credentials: false

      - name: Run trusted policy harness against proposed tree
        shell: bash
        run: |
          set -euo pipefail
          proposed_root="$GITHUB_WORKSPACE"
          trusted_root="$GITHUB_WORKSPACE/trusted-policy"
          for script in scripts/github-review-hygiene.sh scripts/fail-closed-self-test.sh; do
            [ -f "$trusted_root/$script" ] || {
              echo "::error::trusted base is missing $script"
              exit 1
            }
          done

          ROOT_OVERRIDE="$proposed_root" \
            bash "$trusted_root/scripts/fail-closed-self-test.sh"

          stale_dispatcher_comments="$(mktemp)"
          cat >"$stale_dispatcher_comments" <<'EOF'
          COMMENT_ID=1
          Latest clean-layout repro evidence: https://github.com/dusk-network/hyperlane-dusk/issues/2#issuecomment-4443963744
          ---END---
          EOF

          stale_scan_log="$(mktemp)"
          if ROOT_OVERRIDE="$proposed_root" \
              bash "$trusted_root/scripts/github-review-hygiene.sh" \
              --dispatcher-comment-scan-only "$stale_dispatcher_comments" \
              >"$stale_scan_log" 2>&1; then
            echo "::error::stale dispatcher repro evidence was accepted"
            exit 1
          fi
          if ! rg -Fq 'stale dispatcher clean-layout repro evidence' "$stale_scan_log"; then
            cat "$stale_scan_log" >&2
            echo "::error::stale dispatcher negative test failed outside the expected policy branch"
            exit 1
          fi
