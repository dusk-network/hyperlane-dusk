name: Dusk Hyperlane Manual Repro Check
run-name: Dusk Hyperlane repro dusk=${{ inputs.dusk_ref }} rusk=${{ inputs.rusk_ref }} monorepo=${{ inputs.monorepo_ref }}

on:
  workflow_dispatch:
    inputs:
      dusk_ref:
        description: "dusk-network/hyperlane-dusk ref to checkout"
        required: true
        default: "feat/dusk-hardening-v2"
      rusk_ref:
        description: "dusk-network/rusk-private ref to checkout"
        required: true
        default: "c0c64db4659500d077bb253ad13acba0e347d3fc"
      monorepo_ref:
        description: "dusk-network/hyperlane-monorepo ref to checkout"
        required: true
        default: "feat/dusk-support-v2"

permissions:
  contents: read

jobs:
  local-repro:
    name: Local repro wrapper
    runs-on: [self-hosted, linux, dusk-hyperlane]
    timeout-minutes: 120

    steps:
      - name: Checkout Dusk Hyperlane
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.dusk_ref }}
          path: hyperlane/dusk
          persist-credentials: false

      - name: Checkout private Rusk dependency
        uses: actions/checkout@v6
        with:
          repository: dusk-network/rusk-private
          ref: ${{ inputs.rusk_ref }}
          path: rusk-private
          token: ${{ secrets.DUSK_ORG_READ_TOKEN }}
          persist-credentials: false

      - name: Checkout Dusk Hyperlane monorepo fork
        uses: actions/checkout@v6
        with:
          repository: dusk-network/hyperlane-monorepo
          ref: ${{ inputs.monorepo_ref }}
          path: hyperlane/hyperlane-monorepo
          token: ${{ secrets.DUSK_ORG_READ_TOKEN }}
          persist-credentials: false

      - name: Report resolved checkout heads
        shell: bash
        run: |
          set -euo pipefail
          printf 'dusk_ref=%s\n' '${{ inputs.dusk_ref }}'
          git -C hyperlane/dusk rev-parse HEAD
          printf 'rusk_ref=%s\n' '${{ inputs.rusk_ref }}'
          git -C rusk-private rev-parse HEAD
          printf 'monorepo_ref=%s\n' '${{ inputs.monorepo_ref }}'
          git -C hyperlane/hyperlane-monorepo rev-parse HEAD

      - name: Run local repro check
        working-directory: hyperlane/dusk
        shell: bash
        env:
          CARGO_TERM_COLOR: always
        run: |
          set -euo pipefail
          make repro-check-agent
