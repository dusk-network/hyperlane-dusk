[package]
name = "hyperlane-dusk-warp-drc20-collateral"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[target.'cfg(target_family = "wasm")'.dependencies]
hyperlane-dusk-types = { workspace = true }
dusk-core = { workspace = true }
dusk-bytes = "0.1.7"
dusk-forge = { workspace = true }
bytecheck = { workspace = true }
rkyv = { workspace = true }

[features]
contract = ["dusk-core/abi-dlmalloc", "hyperlane-dusk-types/abi"]

[lib]
crate-type = ["cdylib"]
