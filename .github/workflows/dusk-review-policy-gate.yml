name: Dusk Review Policy Gate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-policy-gate:
    name: Dusk review policy gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12

      - name: Check worktree and diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$(git ls-files --others --exclude-standard)" ]; then
            git ls-files --others --exclude-standard
            echo "::error::untracked source paths found"
            exit 1
          fi

          base_ref="${GITHUB_BASE_REF:-main}"
          if git rev-parse --verify "origin/$base_ref" >/dev/null 2>&1; then
            git diff --check "origin/$base_ref"...HEAD
          else
            git diff --check HEAD~1..HEAD
          fi

      - name: Check review guard scripts
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f scripts/github-review-hygiene.sh ] || [ ! -f scripts/fail-closed-self-test.sh ]; then
            echo "Review guard scripts not present in this workflow-only branch; skipping script checks."
            exit 0
          fi

          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ripgrep
          fi

          for script in scripts/github-review-hygiene.sh scripts/fail-closed-self-test.sh; do
            bash -n "$script"
          done

          stale_dispatcher_comments="$(mktemp)"
          cat >"$stale_dispatcher_comments" <<'EOF'
          COMMENT_ID=1
          Latest clean-layout repro evidence: https://github.com/dusk-network/hyperlane-dusk/issues/2#issuecomment-4443963744
          ---END---
          EOF

          if bash scripts/github-review-hygiene.sh --dispatcher-comment-scan-only "$stale_dispatcher_comments"; then
            echo "::error::stale dispatcher repro evidence was accepted"
            exit 1
          fi
