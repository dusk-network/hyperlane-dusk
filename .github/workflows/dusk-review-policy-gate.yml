name: Dusk Review Policy Gate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-policy-gate:
    name: Dusk review policy gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12

      - name: Check worktree and diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$(git ls-files --others --exclude-standard)" ]; then
            git ls-files --others --exclude-standard
            echo "::error::untracked source paths found"
            exit 1
          fi

          base_ref="${GITHUB_BASE_REF:-main}"
          if git rev-parse --verify "origin/$base_ref" >/dev/null 2>&1; then
            git diff --check "origin/$base_ref"...HEAD
          else
            git diff --check HEAD~1..HEAD
          fi

      - name: Check review guard scripts
        shell: bash
        run: |
          set -euo pipefail
          base_ref="origin/${GITHUB_BASE_REF:-main}"
          git rev-parse --verify "$base_ref" >/dev/null 2>&1 || {
            echo "::error::cannot resolve trusted base ref $base_ref"
            exit 1
          }

          missing_from_head=0
          missing_from_base=0
          for script in scripts/github-review-hygiene.sh scripts/fail-closed-self-test.sh; do
            if [ ! -f "$script" ]; then
              missing_from_head=$((missing_from_head + 1))
              if git cat-file -e "$base_ref:$script" 2>/dev/null; then
                echo "::error::$script exists on $base_ref but is missing from the proposed tree"
                exit 1
              fi
              missing_from_base=$((missing_from_base + 1))
            fi
          done

          if [ "$missing_from_head" -ne 0 ]; then
            if [ "$missing_from_head" -eq 2 ] && [ "$missing_from_base" -eq 2 ]; then
              echo "Review guards are absent from both the trusted base and proposed workflow-only tree; no guard removal occurred."
              exit 0
            fi
            echo "::error::review guard set is incomplete"
            exit 1
          fi

          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ripgrep
          fi

          for script in scripts/github-review-hygiene.sh scripts/fail-closed-self-test.sh; do
            bash -n "$script"
          done

          stale_dispatcher_comments="$(mktemp)"
          cat >"$stale_dispatcher_comments" <<'EOF'
          COMMENT_ID=1
          Latest clean-layout repro evidence: https://github.com/dusk-network/hyperlane-dusk/issues/2#issuecomment-4443963744
          ---END---
          EOF

          stale_scan_log="$(mktemp)"
          if bash scripts/github-review-hygiene.sh \
              --dispatcher-comment-scan-only "$stale_dispatcher_comments" \
              >"$stale_scan_log" 2>&1; then
            echo "::error::stale dispatcher repro evidence was accepted"
            exit 1
          fi
          if ! rg -Fq 'stale dispatcher clean-layout repro evidence' "$stale_scan_log"; then
            cat "$stale_scan_log" >&2
            echo "::error::stale dispatcher negative test failed outside the expected policy branch"
            exit 1
          fi
