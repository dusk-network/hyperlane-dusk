[package]
name = "hyperlane-dusk-integration-tests"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]

[dev-dependencies]
# Types crate (without abi feature — uses software keccak256 fallback)
hyperlane-dusk-types = { workspace = true, features = ["drc20"] }

# Dusk
dusk-core = { workspace = true }
dusk-bytes = "0.1.7"
dusk-vm = { workspace = true, default-features = false }

# Test utilities
ff = { workspace = true }
bytecheck = { workspace = true }
rand = { workspace = true }
rkyv = { workspace = true, features = ["validation"] }
rusk-prover = { workspace = true }
wasmtime = { workspace = true }

# Pin to avoid edition2024 issues (no blake2b_simd pin — let cargo resolve
# both versions needed by crates.io dusk-core and local dusk-core)
blake3 = { workspace = true }
constant_time_eq = { workspace = true }
time-core = { workspace = true }
