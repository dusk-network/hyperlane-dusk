[package]
name = "hyperlane-dusk-warp-drc20-collateral"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[target.'cfg(target_family = "wasm")'.dependencies]
hyperlane-dusk-types = { workspace = true }
dusk-core = { workspace = true }
dusk-bytes = "0.1.7"
dusk-forge = { workspace = true }
bytecheck = { workspace = true }
rkyv = { workspace = true }

[features]
contract = ["dusk-core/abi-dlmalloc", "hyperlane-dusk-types/abi"]
data-driver = []

[lib]
crate-type = ["cdylib"]

[lints.rust]
# `make warp-drc20-collateral-unguarded` builds a test-only copy of the route
# without its reentrancy guard; see `enter` in src/lib.rs.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(hyperlane_dusk_unguarded_test)"] }
