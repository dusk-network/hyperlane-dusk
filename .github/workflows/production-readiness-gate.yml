name: Dusk Hyperlane Production Readiness Gate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      monorepo_ref:
        description: "dusk-network/hyperlane-monorepo branch or ref to compare"
        required: true
        default: "feat/dusk-support-v2"

permissions:
  actions: read
  checks: read
  contents: read
  issues: read
  pull-requests: read
  security-events: read
  statuses: read

jobs:
  readiness-guard:
    name: Production readiness guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.DUSK_STATUS_READ_TOKEN || secrets.DUSK_ORG_READ_TOKEN || github.token }}
      DUSK_STATUS_READ_TOKEN_CONFIGURED: ${{ secrets.DUSK_STATUS_READ_TOKEN != '' }}
      DUSK_ORG_READ_TOKEN_CONFIGURED: ${{ secrets.DUSK_ORG_READ_TOKEN != '' }}
      DUSK_DIR: ${{ github.workspace }}/hyperlane/dusk
      READINESS_MODE: ${{ github.event_name == 'pull_request' && 'premerge' || 'production' }}
      CURRENT_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
      MONOREPO_REF: ${{ inputs.monorepo_ref || 'feat/dusk-support-v2' }}
      MONOREPO_COMPARE_VIA_GH: "1"
      MONOREPO_COMPARE_HEAD: dusk-network:${{ inputs.monorepo_ref || 'feat/dusk-support-v2' }}
      STATUS_CHECK_WAIT_SECONDS: "300"

    steps:
      - name: Checkout Dusk Hyperlane
        uses: actions/checkout@v6
        with:
          path: hyperlane/dusk
          fetch-depth: 0
          persist-credentials: false

      - name: Report resolved check refs
        shell: bash
        run: |
          set -euo pipefail
          printf 'dusk_ref=%s\n' "$GITHUB_SHA"
          git -C "$DUSK_DIR" rev-parse HEAD
          printf 'monorepo_ref=%s\n' "$MONOREPO_REF"
          printf 'monorepo_compare_head=%s\n' "$MONOREPO_COMPARE_HEAD"
          printf 'readiness_mode=%s\n' "$READINESS_MODE"
          printf 'current_pr_number=%s\n' "$CURRENT_PR_NUMBER"
          printf 'dusk_status_read_token_configured=%s\n' "$DUSK_STATUS_READ_TOKEN_CONFIGURED"
          printf 'dusk_org_read_token_configured=%s\n' "$DUSK_ORG_READ_TOKEN_CONFIGURED"
          if [ "$DUSK_STATUS_READ_TOKEN_CONFIGURED" = "true" ]; then
            printf 'production_readiness_token_source=%s\n' 'DUSK_STATUS_READ_TOKEN'
          elif [ "$DUSK_ORG_READ_TOKEN_CONFIGURED" = "true" ]; then
            printf 'production_readiness_token_source=%s\n' 'DUSK_ORG_READ_TOKEN'
          else
            printf 'production_readiness_token_source=%s\n' 'github.token'
          fi

      - name: Run production readiness guard
        working-directory: ${{ env.DUSK_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          make production-readiness-guard
