[package]
name = "dusk-tx"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "dusk-tx"
path = "src/main.rs"

[dependencies]
# Internal
hyperlane-dusk-types = { workspace = true, features = ["drc20"] }

# Dusk — using same local fork as workspace
dusk-core = { workspace = true }
dusk-bytes = "0.1.7"

# Serialization
rkyv = { workspace = true, features = ["validation"] }
blake3 = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { version = "1", features = ["std"] }

# Crypto
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", features = ["hmac"] }
sha2 = "0.10"
# Recover who signed a validator's announcement or checkpoint, as the
# contracts do with the secp256k1 host query.
secp256k1 = { version = "0.31.1", features = ["recovery"] }
base64 = "0.22"

# HTTP + async
reqwest = { version = "0.12", features = ["rustls-tls"] }
tokio = { version = "1", features = ["full"] }
hex = "0.4"
bs58 = "0.5"

# CLI
clap = { version = "4", features = ["derive"] }

# Pin to avoid edition2024 issues
blake2b_simd = { workspace = true }
constant_time_eq = { workspace = true }
time-core = { workspace = true }

[dev-dependencies]
# The canonical DRC20's own types, which the mirrors in
# src/canonical_drc20.rs must archive as (as in the types crate's tests).
canonical-dusk-contract-standards = { package = "dusk-contract-standards", git = "https://github.com/dusk-network/contracts", rev = "bc1b00ee0af059975e158b7b580b4d0c0f1bdf9f" }
canonical-dusk-core = { package = "dusk-core", version = "=1.6.0" }
