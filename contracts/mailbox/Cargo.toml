[package]
name = "hyperlane-dusk-mailbox"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[target.'cfg(target_family = "wasm")'.dependencies]
hyperlane-dusk-types = { workspace = true }
dusk-core = { workspace = true }
dusk-bytes = "0.1.7"
dusk-forge = { workspace = true }

[features]
contract = ["dusk-core/abi-dlmalloc", "hyperlane-dusk-types/abi"]
data-driver = []

[lib]
crate-type = ["cdylib"]

[lints.rust]
# `make mailbox-ungated` builds a test-only copy without the caller check in
# `process`; see there in src/lib.rs.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(hyperlane_dusk_ungated_test)"] }
